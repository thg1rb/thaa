name: Release

run-name: >-
  Thaa ${{ inputs.mode == 'publish' && 'v0.1.0 pre-release' || 'release candidate' }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Candidate builds artifacts only; publish validates and builds v0.1.0 before a protected pre-release
        required: true
        type: choice
        options:
          - candidate
          - publish
        default: candidate
      release_tag:
        description: Final mode accepts only the existing v0.1.0 tag on main
        required: false
        type: string
        default: v0.1.0

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-source:
    name: Validate trusted workflow ref and release source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      source_ref: ${{ steps.source.outputs.source_ref }}
    steps:
      - name: Check out trusted main workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Validate dispatch ref and source
        id: source
        env:
          MODE: ${{ inputs.mode }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Release workflow must run from trusted main." >&2
            exit 1
          fi

          git fetch origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/heads/develop:refs/remotes/origin/develop' \
            --no-tags
          if [[ "$MODE" == "candidate" ]]; then
            source_commit="$(git rev-parse 'refs/remotes/origin/develop^{commit}')"
            echo "Validated candidate source commit: $source_commit" >> "$GITHUB_STEP_SUMMARY"
            echo "source_ref=$source_commit" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$MODE" != "publish" || "$RELEASE_TAG" != "v0.1.0" ]]; then
            echo "Final publication accepts only mode=publish and release_tag=v0.1.0." >&2
            exit 1
          fi
          git fetch origin refs/tags/v0.1.0:refs/tags/v0.1.0 --no-tags
          git merge-base --is-ancestor v0.1.0 origin/main || {
            echo "v0.1.0 must point to an approved commit reachable from main." >&2
            exit 1
          }
          source_commit="$(git rev-parse 'v0.1.0^{commit}')"
          echo "Validated release source commit: $source_commit" >> "$GITHUB_STEP_SUMMARY"
          echo "source_ref=$source_commit" >> "$GITHUB_OUTPUT"
        shell: bash

  macos:
    name: macOS arm64 signed DMG
    needs: [validate-source]
    if: ${{ inputs.mode == 'candidate' || inputs.mode == 'publish' }}
    runs-on: macos-15
    timeout-minutes: 60
    environment: release
    steps:
      - name: Require macOS signing and notarization credentials
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          API_KEY_ID: ${{ vars.APPLE_API_KEY }}
          API_ISSUER: ${{ vars.APPLE_API_ISSUER }}
          TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          missing=0
          for entry in \
            "Developer ID certificate:$CERTIFICATE" \
            "certificate password:$CERTIFICATE_PASSWORD" \
            "Developer ID signing identity:$SIGNING_IDENTITY" \
            "App Store Connect API key ID:$API_KEY_ID" \
            "App Store Connect issuer ID:$API_ISSUER" \
            "Apple Team ID:$TEAM_ID" \
            "App Store Connect private key:$API_KEY_P8"; do
            label="${entry%%:*}"
            value="${entry#*:}"
            if [[ -z "$value" ]]; then
              echo "Missing required release credential/configuration: $label" >&2
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            echo "See docs/releases/v0.1.0-release-credentials.md. No unsigned macOS package will be emitted." >&2
            exit 1
          fi
        shell: bash

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-source.outputs.source_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Write notarization key to runner temporary storage
        env:
          APPLE_API_KEY: ${{ vars.APPLE_API_KEY }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"
          unset APPLE_API_KEY_P8_BASE64
        shell: bash

      - name: Build signed, notarized, and stapled DMG
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ vars.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ vars.APPLE_API_ISSUER }}
        run: pnpm tauri build --bundles dmg

      - name: Verify Developer ID signature, notarization, stapling, and Gatekeeper
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          app="src-tauri/target/release/bundle/macos/Thaa.app"
          dmg="src-tauri/target/release/bundle/dmg/Thaa_0.1.0_aarch64.dmg"
          test -d "$app"
          test -f "$dmg"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=4 "$app" 2>&1 | grep -F "TeamIdentifier=$APPLE_TEAM_ID"
          xcrun stapler validate "$dmg"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"
          hdiutil verify "$dmg"
          cd "$(dirname "$dmg")"
          shasum -a 256 "$(basename "$dmg")" > SHA256SUMS.txt
          shasum -a 256 --check SHA256SUMS.txt
        shell: bash

      - name: Upload macOS candidate/release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-aarch64
          path: |
            src-tauri/target/release/bundle/dmg/Thaa_0.1.0_aarch64.dmg
            src-tauri/target/release/bundle/dmg/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows x64 unsigned NSIS
    needs: [validate-source]
    if: ${{ inputs.mode == 'candidate' || inputs.mode == 'publish' }}
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-source.outputs.source_ref }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build release-profile NSIS installer
        run: pnpm tauri build --bundles nsis

      - name: Verify unsigned installer identity and checksum
        shell: pwsh
        run: |
          $installer = 'src-tauri/target/release/bundle/nsis/Thaa_0.1.0_x64-setup.exe'
          if (-not (Test-Path $installer)) { throw "Expected installer missing: $installer" }
          $signature = Get-AuthenticodeSignature $installer
          if ($signature.Status -ne 'NotSigned') { throw "Expected unsigned alpha installer; found $($signature.Status)" }
          $hash = Get-FileHash -Algorithm SHA256 $installer
          "$($hash.Hash.ToLower())  Thaa_0.1.0_x64-setup.exe" | Set-Content -NoNewline -Encoding ascii 'src-tauri/target/release/bundle/nsis/SHA256SUMS.txt'
          $expected = (Get-Content 'src-tauri/target/release/bundle/nsis/SHA256SUMS.txt' -Raw).Trim().Split(' ')[0]
          if ((Get-FileHash -Algorithm SHA256 $installer).Hash.ToLower() -ne $expected) { throw 'Windows installer checksum verification failed.' }

      - name: Upload Windows candidate/release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/Thaa_0.1.0_x64-setup.exe
            src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish draft pre-release
    needs: [validate-source, macos, windows]
    if: >-
      inputs.mode == 'publish' &&
      needs.macos.result == 'success' &&
      needs.windows.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release-publish
    permissions:
      contents: write
    steps:
      - name: Check out validated release source and notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-source.outputs.source_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download verified platform artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-aarch64
          path: release-assets/macos

      - name: Download Windows artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-x64
          path: release-assets/windows

      - name: Assemble exact release assets and checksum manifest
        run: |
          test -f release-assets/macos/Thaa_0.1.0_aarch64.dmg
          test -f release-assets/windows/Thaa_0.1.0_x64-setup.exe
          (cd release-assets/macos && shasum -a 256 --check SHA256SUMS.txt)
          (cd release-assets/windows && sha256sum --check SHA256SUMS.txt)
          cp release-assets/macos/Thaa_0.1.0_aarch64.dmg release-assets/
          cp release-assets/windows/Thaa_0.1.0_x64-setup.exe release-assets/
          cd release-assets
          sha256sum Thaa_0.1.0_aarch64.dmg Thaa_0.1.0_x64-setup.exe > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

      - name: Create draft pre-release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_RELEASE_COMMIT: ${{ needs.validate-source.outputs.source_ref }}
        run: |
          git fetch origin refs/tags/v0.1.0:refs/tags/v0.1.0 --no-tags
          actual_commit="$(git rev-parse 'refs/tags/v0.1.0^{commit}')"
          if [[ "$actual_commit" != "$EXPECTED_RELEASE_COMMIT" ]]; then
            echo "v0.1.0 changed after source validation; refusing publication." >&2
            exit 1
          fi
          gh release create v0.1.0 \
            --draft \
            --prerelease \
            --verify-tag \
            --title 'Thaa v0.1.0' \
            --notes-file docs/releases/v0.1.0-release-notes.md \
            release-assets/Thaa_0.1.0_aarch64.dmg \
            release-assets/Thaa_0.1.0_x64-setup.exe \
            release-assets/SHA256SUMS.txt
          gh release edit v0.1.0 --draft=false --prerelease
